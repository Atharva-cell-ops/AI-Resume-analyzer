name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build & Test Monorepo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_analyzer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace=server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_analyzer?schema=public"

      - name: Push Database Schema
        run: npm run db:push --workspace=server
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_analyzer?schema=public"

      - name: Build All Workspaces
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_analyzer?schema=public"

      - name: Run Unit & Integration Tests (Vitest)
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/resume_analyzer?schema=public"
          JWT_ACCESS_SECRET: "ci_jwt_access_secret_key_32_characters_minimum"
          JWT_REFRESH_SECRET: "ci_jwt_refresh_secret_key_32_characters_minimum"

