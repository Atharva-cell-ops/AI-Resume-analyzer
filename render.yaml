services:
  - type: web
    name: resuglow-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run db:generate --workspace=server && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: npm run db:push --workspace=server && node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d

