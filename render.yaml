services:
  - type: web
    name: ats-resume-studio-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npx puppeteer browsers install chrome && npm run db:generate --workspace=server && npm run build --workspace=shared && npm run build --workspace=server
    startCommand: node server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_0Pel7fWUTBSK@ep-fancy-morning-be1ymzib-pooler.c-9.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: CLIENT_URL
        value: https://ai-resume-analyzer-smart-pa-ck-ai.vercel.app
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer

